name: Publicar agendados

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-agendados
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar o que venceu
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python3 .github/scripts/publicar_agendados.py
      - name: Gravar resultados
        if: always()
        run: |
          git config user.name "rs-publicador"
          git config user.email "actions@users.noreply.github.com"
          git add resultados.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "resultados: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
